<body style="margin:0;padding:0;overflow:hidden;min-height:100vh;background:#f1f5f9;">
  <!-- Skeleton shown immediately, dismissed once React mounts -->
  <div id="pcw-skeleton">
    <div class="sk-header">
      <div class="sk-bar" style="width:180px;height:22px;background:#2d5a8e"></div>

    </div>

      <div class="sk-bar sk-tab" style="width:70px"></div>
      <div class="sk-bar sk-tab active" style="width:70px"></div>
      <div class="sk-bar sk-tab" style="width:60px"></div>

    </div>
    <div class="sk-content">
      <div class="sk-bar sk-row" style="width:100%;height:40px;border-radius:6px"></div>
      <div class="sk-bar sk-row"></div>
      <div class="sk-bar sk-row narrow"></div>
      <div class="sk-bar sk-row"></div>
      <div class="sk-bar sk-row" style="width:80%"></div>
      <div class="sk-bar sk-row narrow"></div>
      <div class="sk-bar sk-row"></div>
      <div class="sk-bar sk-row" style="width:75%"></div>
    </div>
    <div style="position:absolute;bottom:24px;width:100%;text-align:center;color:#94a3b8;font-size:12px">Loading Global Cost Sheet…</div>
  </div>
  <div id="root" style="margin:0;padding:0;width:100vw;height:100vh;overflow:auto;"></div>
  
  <script>
/* ═══ COSTING ENGINE & CONSTANTS (no JSX) ══════════════════════════════════ */
/* Everything below is pure JS — no Babel/JSX needed, no size limit applies. */
/* React components start in the <script type="text/babel"> block below.     */

// ── App identity ── This is the Global Cost Sheet, a standalone fork of the Parts Costing Worksheet
// (forked from PCW v0.8 · 2026-11-17). It develops separately from the PCW. Storage keys, IndexedDB,
// file extension and protocol differ so both apps can run in the same browser without touching each other's data.
// The PCW_ constant names are kept from the fork point; the values are this app's own.
const APP_ID = 'gcs';                       // prefix for every localStorage / IndexedDB key
const APP_NAME = 'Global Cost Sheet';
const APP_SHORT = 'GCS';
const FILE_EXT = '.gcs';                    // saves as .gcs; still opens PCW .pcw files
const FORKED_FROM = 'PCW v0.8 · 2026-11-17';

const PCW_VERSION = 'v0.16';
const PCW_BUILD = '2026-11-19';

const sanitizeHTML = (val) => {
if (val === null || val === undefined) return '';
return String(val)
 .replace(/&/g, '&amp;')
 .replace(/</g, '&lt;')
 .replace(/>/g, '&gt;')
 .replace(/"/g, '&quot;')
 .replace(/'/g, '&#x27;');
};

const sha256 = async (str) => {
const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
};

// Compute a deterministic state hash for approval integrity checking.
// We hash: items costs/margins, grand total, revision — enough to detect tampering.
const computeApprovalHash = async (proj, items, grand, sheets) => {
// GCS: covers everything that sets the price: line cost, quantity, markup level or Custom %, inflation and
// scaling (typed or automatic inputs), the tab each line is on, every tab's markup table / discount /
// provisions / type, the project-level GCS settings, and the total contract value.
const payload = JSON.stringify({
 rev: proj.rev,
 sellCcy: proj.sellCcy,
 grand: Math.round(grand * 100), // cents to avoid float noise
 gcs: { mAndE: proj.mAndE ?? null, sAndA: proj.sAndAExpense ?? null, discount: proj.gcsDiscount ?? null, roundTo: proj.roundTo ?? null,
   plantFeed: proj.plantFeed ?? null, inflationPerMonth: proj.inflationPerMonth ?? null, scalingExponent: proj.scalingExponent ?? null,
   costingDate: proj.costingDate || null, segment: proj.segment || null },
 sheets: (sheets || []).map(s => ({ id: s.id, type: s.type || null, include: !!s.include, markup: s.markup || null, defaultLevel: s.defaultLevel || null,
   discount: s.discount ?? null, provisions: s.provisions || null })),
 items: items
  .filter(i => i.type !== 'heading')
  .map(i => ({ id: i.id, pn: i.partNumber, qty: i.qty, cost: i.unitCost, margin: i.margin, contingency: i.contingency,
    level: i.markupLevel || null, infl: i.inflationPct ?? null, scale: i.scalingFactor ?? null, date: i.costDate || null,
    size: i.sizeCapacity ?? null, sheet: i.sheetId || null, sub: i.subCat || null }))
  .sort((a,b) => a.id.localeCompare(b.id)),
});
return sha256(payload);
};

// Returns 'match' | 'mismatch' | 'pending' given an approval record and current state.
// 'pending' means we haven't computed yet (async).
const checkApprovalIntegrity = async (approval, proj, items, grand, sheets) => {
if (!approval.stateHash) return 'no-hash';
const current = await computeApprovalHash(proj, items, grand, sheets);
return current === approval.stateHash ? 'match' : 'mismatch';
};

const SCHEMA_VERSION = 2;

const MIGRATIONS = {
0: (data) => ({
 ...data,
 project: {
 ...data.project,
 sAndAExpense:       data.project?.sAndAExpense       ?? 10,
 insideSales:        data.project?.insideSales        ?? '',
 outsideSales:       data.project?.outsideSales       ?? '',
 freightPaymentTerm: data.project?.freightPaymentTerm ?? '',
 locked:             data.project?.locked             ?? false,
 },
}),
1: (data) => ({
 ...data,
 project: {
 ...data.project,
 approvals: data.project?.approvals ?? [],
 },
}),
};

const migrateData = (data) => {
let schemaVer = typeof data.schemaVersion === 'number' ? data.schemaVersion : 0;
// Normalise key names — files saved with 'proj' key must be aliased to 'project'
// before migrations run, since migrations reference data.project
let d = data;
if (d.proj && !d.project) d = { ...d, project: d.proj };
if (d.frt && !d.freight) d = { ...d, freight: d.frt };
if (d.sched && !d.schedule) d = { ...d, schedule: d.sched };
while (schemaVer < SCHEMA_VERSION) {
 if (MIGRATIONS[schemaVer]) d = MIGRATIONS[schemaVer](d);
 schemaVer++;
}
// Re-normalise back to short keys after migration
// GCS: convert lines from before markup levels (defined in engine/gcs.js, loaded after this file)
return gcsMigrateData({ ...d, schemaVersion: SCHEMA_VERSION });
};

const validateLoadedData = (data) => {
const errors = [];
if (!data || typeof data !== 'object') { errors.push('File is not a valid JSON object'); return errors; }
if (!data.project || typeof data.project !== 'object') errors.push('Missing or invalid project data');
if (!Array.isArray(data.items)) errors.push('Missing or invalid items list');
if (data.project) {
 if (data.project.name !== undefined && typeof data.project.name !== 'string') errors.push('Project name must be a string');
 if (data.project.sellCcy && typeof data.project.sellCcy !== 'string') errors.push('Invalid selling currency');
 if (data.project.defaultMargin !== undefined && isNaN(Number(data.project.defaultMargin))) errors.push('Default margin must be a number');
}
if (Array.isArray(data.items)) {
 data.items.forEach((item, i) => {
 if (!item.id)   errors.push(`Item ${i+1}: missing id`);
 if (!item.type) errors.push(`Item ${i+1}: missing type`);
 if (item.qty !== undefined && isNaN(Number(item.qty))) errors.push(`Item ${i+1}: qty must be a number`);
 if (item.unitCost !== undefined && isNaN(Number(item.unitCost))) errors.push(`Item ${i+1}: unitCost must be a number`);
 });
 // Duplicate ID detection — every tree/alloc/sp lookup is a Map keyed by item.id;
 // a duplicate silently overwrites the first item in every one of those maps.
 const seenIds = new Set();
 const dupeIds = new Set();
 data.items.forEach(item => {
  if (!item.id) return;
  if (seenIds.has(item.id)) dupeIds.add(item.id);
  seenIds.add(item.id);
 });
 dupeIds.forEach(id => errors.push(`Duplicate item id: ${id}`));
 // Orphan parent detection — a parentId that doesn't resolve to a real item
 // silently drops that item out of the tree with no error shown anywhere.
 data.items.forEach((item, i) => {
  if (item.parentId && !seenIds.has(item.parentId)) {
   errors.push(`Item ${i+1} (${item.id||'no id'}): parentId "${item.parentId}" does not match any item`);
  }
 });
 // Cycle detection — tree building and cost rollup recurse on parentId/children
 // with no visited-set guard, so a cycle hangs the tab instead of erroring.
 const parentOf = new Map(data.items.filter(i => i.id).map(i => [i.id, i.parentId || null]));
 const cycleIds = new Set();
 parentOf.forEach((_, startId) => {
  const visited = new Set();
  let cur = startId;
  while (cur) {
   if (visited.has(cur)) { cycleIds.add(startId); break; }
   visited.add(cur);
   cur = parentOf.get(cur);
  }
 });
 cycleIds.forEach(id => errors.push(`Item ${id}: circular parent reference detected (BOM cycle)`));
}
return errors;
};

const others = ["North", "Northeast", "Center-West"];

 return 7; // South/Southeast → North/Northeast/Center-West

function parseSalesforceLink(url) {
 if (!url || !url.trim()) return { type: null, id: null };
 // Lightning URL: /lightning/r/Opportunity/006.../view or /lightning/r/Case/500.../view
 const lightningMatch = url.match(/\/lightning\/r\/(Opportunity|Case)\/([a-zA-Z0-9]{15,18})/i);
 if (lightningMatch) return { type: lightningMatch[1], id: lightningMatch[2] };
 // Classic URL: salesforce.com/006... or salesforce.com/500...
 const classicMatch = url.match(/salesforce\.com\/([a-zA-Z0-9]{15,18})/i);
 if (classicMatch) {
  const id = classicMatch[1];
  if (id.startsWith('006')) return { type: 'Opportunity', id };
  if (id.startsWith('500')) return { type: 'Case', id };
 }
 // Any URL containing /Case/ or /Opportunity/
 if (/\/Opportunity\//i.test(url)) return { type: 'Opportunity', id: null };
 if (/\/Case\//i.test(url)) return { type: 'Case', id: null };
 return { type: null, id: null };
}

if(contingency>0&&contingency<100) p/=(1-contingency/100);
if(dealer>0&&dealer<100)           p/=(1-dealer/100);
if(discountMitigation>0&&discountMitigation<100) p/=(1-discountMitigation/100);
return p;
};

// ── Supplier-tagged inbound freight ──────────────────────────────────────────
// An inbound freight entry can be tagged to one or more suppliers; only items from those
// suppliers then carry the charge (weighted by COGS). `supplierTags` (array) is the current
// field. `supplierTag` (string) is the legacy single-supplier field from older saved files, so
// it is still honoured when `supplierTags` is absent. Empty result = untagged = all suppliers.
const getFreightTags = entry => {
  const raw = Array.isArray(entry?.supplierTags) ? entry.supplierTags : [entry?.supplierTag];
  const seen = new Set();
  return raw.map(t => String(t || '').trim()).filter(t => {
    const k = t.toLowerCase();
    if (!t || seen.has(k)) return false;
    seen.add(k);
    return true;
  });
};

// How a supplier-tagged charge is shared out. Landed cost is per ROOT item, so the charge is weighted by
// what each matching node actually contributes to its root's COGS, and each node's slice is credited to
// its root. A node's contribution is its OWN cost x the quantities of every assembly above it (an
// assembly's totalCOGS is (childSum + ownCost) x qty, so children scale with the parent). Contributions
// therefore add up exactly to the root's totalCOGS, so nothing is counted twice and nothing is lost -
// including a matching child that sits under an assembly with a different (or blank) supplier.
// Exclusions match untagged freight: a root that is pricelist / zero-cost carries none of its subtree
// unless forced in; a pricelist item inside an ordinary assembly doesn't carry any either.
// Shared by the allocation (getAlloc) and the freight warnings so they can never disagree.
// roots = the calc'd tree (each node has totalCOGS, qty, supplier, source, _ch).
const freightTagEligibility = (roots, tags, forceAllocToPricelist, forceAllocToZeroCost) => {
  const tagSet = new Set(tags.map(t => t.toLowerCase()));
  const eligibleByTag = {};   // lower-cased tag -> eligible COGS
  const itemCountByTag = {};  // lower-cased tag -> items with that supplier, eligible or not
  tags.forEach(t => { eligibleByTag[t.toLowerCase()] = 0; itemCountByTag[t.toLowerCase()] = 0; });
  const allowZero = !!(forceAllocToZeroCost && forceAllocToZeroCost.freight);
  const skipsFreight = n => (n.source === 'Pricelist' && !forceAllocToPricelist) || (n.totalCOGS === 0 && !allowZero);
  const sliceByNode = new Map(); // node id -> COGS slice (a root's slice is its whole subtree's)
  let total = 0;
  roots.forEach(root => {
    const rootCarries = !skipsFreight(root);
    let rootSlice = 0;
    const visit = (node, ancestorQty) => {
      const kids = node._ch || [];
      const qty = node.qty || 1;
      const sup = (node.supplier || '').trim().toLowerCase();
      if (tagSet.has(sup)) {
        itemCountByTag[sup]++;
        if (rootCarries && !skipsFreight(node)) {
          const own = (node.totalCOGS - qty * kids.reduce((s, c) => s + c.totalCOGS, 0)) * ancestorQty;
          if (own > 1e-9) {
            sliceByNode.set(node.id, own);
            rootSlice += own;
            eligibleByTag[sup] += own;
            total += own;
          }
        }
      }
      kids.forEach(c => visit(c, ancestorQty * qty));
    };
    visit(root, 1);
    if (rootSlice > 0) sliceByNode.set(root.id, rootSlice);
  });
  return { tagSet, total, eligibleByTag, itemCountByTag, sliceByNode };
};

// ── "<BU> Stock" supplier label for pricelist parts ──────────────────────────────
// A part found on the pricelist is a stock item, so auto-fill labels its supplier "<BU> Stock" (BU = the one
// the price actually came from, which may be a fallback BU). Like every other auto-filled field this may only
// write over a supplier that is blank or was itself auto-filled - a supplier the user typed is never
// overwritten. Returns the fields to merge into the item's update, or null to leave the supplier alone.
// mayWriteOverride lets a caller with its own overwrite rule (bulk refresh's skipManual) supply the decision.
const stockSupplierUpdate = (plEntry, item, projBU, mayWriteOverride) => {
  if (!plEntry || !plEntry.isStock) return null;
  const mayWrite = mayWriteOverride !== undefined ? mayWriteOverride : (!item.supplier || item._autoSupplier === true);
  return mayWrite ? { supplier: (plEntry.sourceBU || projBU) + ' Stock', _autoSupplier: true } : null;
};

const fc  = (n,dp=2) => Number(n||0).toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp});
const fp  = n => Number(n||0).toFixed(2)+"%";

const addDays = (dateStr,n) => {
const d=new Date(dateStr||Date.now());
d.setDate(d.getDate()+(parseInt(n)||0));
return d.toISOString().slice(0,10);
};


const calcSiscomex = (numImportedItems) => {
if (numImportedItems === 0) return 0;

const BASE_DI = 185.00; // Base declaration fee
let total = BASE_DI;

for (let i = 1; i <= numImportedItems; i++) {
 if (i === 1) {
 total += 29.50;
 } else if (i >= 2 && i <= 3) {
 total += 23.60;
 } else if (i >= 4 && i <= 10) {
 total += 17.70;
 } else if (i >= 11 && i <= 20) {
 total += 11.80;
 } else if (i >= 21 && i <= 50) {
 total += 5.90;
 } else { // 51+
 total += 2.95;
 }
}

return total;
};

const calcImportTax = (cogsBRL, customsCharges=9, ii=0) => {
const customs = cogsBRL * (customsCharges / 100);
const iiAmt = cogsBRL * (ii / 100);
return {
 customs,
 ii: iiAmt,
 total: customs + iiAmt
};
};

const calcSalesTax = (sellPriceBRL, tc={}) => {

const cfg = {...BR_DEFAULTS, ...tc};
const ipi_r    = (cfg.ipi    || 0) / 100;
const pis_r    = (cfg.pis    || 0) / 100;
const cofins_r = (cfg.cofins || 0) / 100;
const icms_f   = ((cfg.icms || 0) / 100) * ((cfg.icmsBase || 100) / 100);

const x     = 1 / (1 + ipi_r);                                 // 1/(1+IPI)
const denom = (x - icms_f) * (1 - pis_r - cofins_r);
if (denom <= 0) return { ipi: 0, pis: 0, cofins: 0, icms: 0, total: 0 };

const gross  = sellPriceBRL / denom;                            // grossPrice = net * markup
const B      = gross / (1 + ipi_r);                            // ex-IPI base
const TB     = B - gross * icms_f;                             // PIS/COFINS base

const ipi    = B  * ipi_r;
const pis    = TB * pis_r;
const cofins = TB * cofins_r;
const icms   = gross * icms_f;

return {
 ipi,
 pis,
 cofins,
 icms,
 total: ipi + pis + cofins + icms
};
};

const buildTree = flat => {
const map={};
flat.filter(i=>i.type!=="heading").forEach(i=>(map[i.id]={...i,_ch:[]}));
const roots=[];
flat.filter(i=>i.type!=="heading").forEach(i=>{
 if(i.parentId&&map[i.parentId]) map[i.parentId]._ch.push(map[i.id]);
 else roots.push(map[i.id]);
});
return roots;
};

const calcNode = (n, rates, sellCcy, opts={}) => {
const cv = (a,c) => conv(a, c||"USD", sellCcy, rates);

// GCS: a line's unit cost is scaled and inflated (Excel: cost_USD × scaling × (1 + inflation)).
const costFactor = gcsCostFactor(n, opts.proj);
if (!n._ch.length) {
 const unitC = cv(n.unitCost||0, n.ccy) * costFactor;
 const totalCOGS = unitC * (n.qty||1);
 const importedSubCount = 0;
 const afrmmSubCount = 0;
 // Leaf node: critical path = its own lead time (supplier delivery time)
 const criticalPathDays = n.leadTimeOverride ?? (n.leadTime||0);
 return { ...n, _ch: [], unitC, totalCOGS, importedSubCount, afrmmSubCount, criticalPathDays, costFactor };
}

const children = n._ch.map(c => calcNode(c, rates, sellCcy, opts));
const ownC = cv(n.unitCost||0, n.ccy) * costFactor;
const childSum = children.reduce((s,c) => s + c.totalCOGS, 0);
const totalCOGS = (childSum + ownC) * (n.qty||1);

const importedSubCount = children.reduce((s,c) =>
 s + (c.importedSubCount||0) + (c.imported ? 1 : 0), 0);
const afrmmSubCount = children.reduce((s,c) =>
 s + (c.afrmmSubCount||0) + (c.afrmm ? 1 : 0), 0);

// Parent critical path: children procured in parallel → max child path,
// then add own fabrication/assembly time (leadTime on the parent node).
// leadTimeOverride lets the user manually specify the total if the parallel
// assumption doesn't hold for a particular assembly.
const longestChildPath = Math.max(0, ...children.map(c => c.criticalPathDays||0));
const criticalPathDays = n.leadTimeOverride != null
 ? n.leadTimeOverride
 : longestChildPath + (n.leadTime||0);

return {
 ...n, _ch: children,
 unitC: totalCOGS / (n.qty||1),
 totalCOGS,
 importedSubCount,
 afrmmSubCount,
 criticalPathDays,
 costFactor,
};
};


// ── Customer-based default Discount Mitigation ──
// Customers whose name starts with a listed prefix get a default Discount Mitigation %
// when the customer is entered/selected. Applied only on a non-match -> match change of
// the customer name, and only if mitigation is still 0, so manual edits and loaded files
// are never overridden. If the name later stops matching and the value is still the
// auto-applied one, it is reset to 0.
const CUST_DISC_MIT_RULES = [{ prefix: 'adm', pct: 3 }, { prefix: 'sojaprotein', pct: 3 }];
const customerMitigationDefault = (name) => {
  const n = (name || '').trim().toLowerCase();
  const r = CUST_DISC_MIT_RULES.find(r => n.startsWith(r.prefix));
  return r ? r.pct : null;
};
const applyCustomerMitigation = (prev, next) => {
  if (!prev || !next || next.locked) return next;
  const pn = prev.customer && prev.customer.name, nn = next.customer && next.customer.name;
  if (pn === nn) return next;
  const pct = customerMitigationDefault(nn);
  const wasPct = customerMitigationDefault(pn);
  const cur = Number(next.discountMitigation) || 0;
  if (pct != null && wasPct == null && cur === 0) return { ...next, discountMitigation: pct, _discMitAuto: pct };
  if (pct == null && prev._discMitAuto != null) {
    return { ...next, discountMitigation: cur === prev._discMitAuto ? 0 : next.discountMitigation, _discMitAuto: undefined };
  }
  return next;
};

// ═══ GCS COSTING RULES (Excel Global Cost Sheet V3.8 methodology) ════════════
// Reference data and pure functions for the project-costing method taken from the Excel GCS
// (see project doc claude/GCS_EXCEL_LOGIC_MAP.md for the Excel formulas each piece mirrors).
// No React. Used by calcNode (line cost), computePricing (markup) and computeGcsSummary (P&L).

const GCS_DEFAULT_MARKUP = { 'PASS': 0, 'CPM (A)': 10, 'CPM (B)': 46.5, 'CROWN (A)': 48, 'CROWN (B)': 60, 'CROWN (C)': 60 };

  'CROWN (A)': 'Contribution Margin (A)',
  'CROWN (B)': 'Contribution Margin (B)',

const GCS_BID_LOCATIONS = [
  { name: 'Americas - USA', mAndE: 10, sAndA: 10 },
  { name: 'Americas - Brazil', mAndE: 10, sAndA: 10 },
  { name: 'Americas - Argentina', mAndE: 10, sAndA: 10 },

// ── Segments and EBITDA targets (Excel Engine M:O): % for projects over / under $1m ──
const GCS_SEGMENTS = [
  { name: 'Crush (Preparation & Pressing)', over1m: 21, under1m: 30 },
  { name: 'Crush (Extraction)', over1m: 21, under1m: 30 },
  { name: 'Liquids (Refining, Biodiesel, Oleochemicals)', over1m: 20, under1m: 30 },
  { name: 'Liquids (Renewable Diesel Pretreatment)', over1m: 21, under1m: 30 },
  { name: 'Specialty (Protein Concentrate)', over1m: 36, under1m: 45 },
  { name: 'New Innovations', over1m: 41, under1m: 41 },
  { name: 'Expanded Scope', over1m: 30, under1m: 30 },
  { name: 'Specialty Hemp-CBD', over1m: 36, under1m: 45 },
  { name: 'Specialty - All Other', over1m: 36, under1m: 45 },
  { name: 'Aftermarket: POC Crush', over1m: 21, under1m: 30 },
  { name: 'Aftermarket: POC Liquids', over1m: 20, under1m: 30 },
  { name: 'Aftermarket: POC Specialty', over1m: 36, under1m: 45 },
];
const GCS_TARGET_BAND_WIDTH = 5;   // ON TARGET = target to target + 5 points
const GCS_VALUE_THRESHOLD_USD = 1000000;

// ── Project-level defaults ──
const GCS_DEFAULT_INFLATION_PER_MONTH = 0.5;   // % per whole month since the cost date (Excel: DATEDIF(..,"m")*0.5%)
const GCS_DEFAULT_SCALING_EXPONENT = 0.6;      // six-tenths rule: (plant feed / equipment size)^0.6
const GCS_DEFAULT_ROUND_TO = 1000;             // proposal lines rounded UP to this

// Tab settings with defaults filled in. A costing sheet is {id, name, ...gcs settings}.
const gcsSheetSettings = sheet => {
  const s = sheet || {};
  return {
    type: s.type === 'option' ? 'option' : 'section',
    include: s.type === 'option' ? !!s.include : true,
    markup: { ...GCS_DEFAULT_MARKUP, ...(s.markup || {}) },
    defaultLevel: s.defaultLevel || GCS_DEFAULT_LEVEL,
    discount: (s.discount === null || s.discount === undefined || s.discount === '') ? null : Number(s.discount),
    segment: s.segment || '',
    provisions: { ...GCS_DEFAULT_PROVISIONS, ...(s.provisions || {}) },
  };
};

// Map sheetId → settings; items whose sheetId matches no sheet belong to the first sheet.
const gcsSheetIndex = sheets => {
  const list = Array.isArray(sheets) && sheets.length ? sheets : [{ id: 'main', name: 'Sheet 1' }];
  const byId = new Map(list.map(s => [s.id, gcsSheetSettings(s)]));
  const firstId = list[0].id;
  const idOf = item => (item && byId.has(item.sheetId) ? item.sheetId : firstId);
  return { list, byId, firstId, idOf, settingsOf: item => byId.get(idOf(item)) };
};

// Margin % for a line.
//   markupLevel unset   → follows the tab's default level (new lines)
//   markupLevel CUSTOM  → the line's own margin % (also every line in a file from before markup levels,
//                         converted on load by gcsMigrateData so old prices are unchanged)
//   markupLevel a level → that level's % in the tab's markup table
const gcsLevelOf = (item, settings) => item.markupLevel || (settings ? settings.defaultLevel : GCS_DEFAULT_LEVEL);
const gcsMarkupPct = (item, settings) => {
  const level = gcsLevelOf(item, settings);
  if (level === GCS_CUSTOM_LEVEL) return item.margin || 0;
  const pct = settings && settings.markup ? settings.markup[level] : undefined;
  return pct === undefined || pct === null || pct === '' || isNaN(Number(pct)) ? (GCS_DEFAULT_MARKUP[level] || 0) : Number(pct);
};

// Whole months from d1 to d2 (Excel DATEDIF "m"). 0 when either date is missing or d1 is after d2.
const gcsMonthsBetween = (d1, d2) => {
  const a = d1 ? new Date(d1) : null, b = d2 ? new Date(d2) : null;
  if (!a || !b || isNaN(a) || isNaN(b) || a > b) return 0;
  let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) m -= 1;
  return Math.max(0, m);
};
const gcsCostingDate = proj => proj?.costingDate || new Date().toISOString().slice(0, 10);

// Inflation and scaling: automatic like Excel unless the line has its own value.
const gcsAutoInflation = (item, proj) => {
  const rate = proj?.inflationPerMonth ?? GCS_DEFAULT_INFLATION_PER_MONTH;
  return gcsMonthsBetween(item.costDate, gcsCostingDate(proj)) * rate;   // %
};
// Excel rule: automatic scaling only on EQD lines (equipment chosen from the Equipment Quotations Database);
// every other line is 1.00× unless a factor is typed.
const gcsIsEqdLine = item => !!(item && item.eqd && item.eqd.equipment);
const gcsAutoScaling = (item, proj) => {
  if (!gcsIsEqdLine(item)) return 1;
  const feed = Number(proj?.plantFeed) || 0, size = Number(item.sizeCapacity) || 0;
  if (!(feed > 0) || !(size > 0)) return 1;
  return Math.pow(feed / size, proj?.scalingExponent ?? GCS_DEFAULT_SCALING_EXPONENT);
};
const gcsHasValue = v => v !== null && v !== undefined && v !== '' && !isNaN(Number(v));
const gcsInflationPct = (item, proj) => gcsHasValue(item.inflationPct) ? Number(item.inflationPct) : gcsAutoInflation(item, proj);
const gcsScaling = (item, proj) => gcsHasValue(item.scalingFactor) ? Number(item.scalingFactor) : gcsAutoScaling(item, proj);
// Factor applied to a line's unit cost (Excel: cost_USD × Q × (1 + R)).
const gcsCostFactor = (item, proj) => gcsScaling(item, proj) * (1 + gcsInflationPct(item, proj) / 100);

// Contingency is not part of the GCS method. Files saved before (and PCW quotes) are converted on load:
// the contingency is folded into a Custom margin so the price is unchanged. applyMargins divides by
// (1 − m) and then (1 − c), each only when strictly between 0 and 100, so the combined margin is
// 1 − (1 − m)(1 − c) with the same conditions.
const gcsFoldContingency = item => {
  const c = Number(item.contingency) || 0;
  if (!(c > 0 && c < 100)) return item.contingency ? { ...item, contingency: 0 } : item;
  const m = Number(item.margin) || 0;
  const keepM = m > 0 && m < 100 ? 1 - m / 100 : 1;
  const combined = (1 - keepM * (1 - c / 100)) * 100;
  return { ...item, margin: combined, contingency: 0, markupLevel: GCS_CUSTOM_LEVEL,
    _foldedContingency: { margin: m, contingency: c } };
};

const gcsSegmentTarget = (segment, projectValueUSD) => {
  const s = GCS_SEGMENTS.find(x => x.name === segment);
  if (!s) return null;
  return projectValueUSD > GCS_VALUE_THRESHOLD_USD ? s.over1m : s.under1m;
};
const gcsBand = (ebitdaPct, targetPct) => {
  if (targetPct === null || targetPct === undefined) return '';
  if (ebitdaPct < targetPct) return 'LOW: BELOW TARGET';
  if (ebitdaPct <= targetPct + GCS_TARGET_BAND_WIDTH) return 'ON TARGET';
  return 'HIGH: MORE THAN 5% ABOVE TARGET';
};
const gcsCeil = (v, step) => (step > 0 ? Math.ceil(v / step - 1e-9) * step : v);

// ── Costing confidence mix (Excel: pie of line cost by Cost Confidence on each Plant Section) ──
// Web GCS uses each line's Source. Cost = the cost the line itself carries (leaf cost; a BOM parent's own cost),
// multiplied through its parents' quantities, so the parts add up to the tab's line cost.
const GCS_CONFIDENCE_COLORS = { Quotation: '#16a34a', Pricelist: '#2563eb', 'Project Cost': '#7c3aed', EQD: '#0891b2', 'Item Cost Use Guidance': '#f59e0b', Estimate: '#9ca3af', '': '#e2e8f0' };
const gcsConfidenceLabel = src => (src ? (src === 'Item Cost Use Guidance' ? 'ICUG' : src) : 'No source');
const gcsConfidenceMix = roots => {
  const by = new Map();
  const add = (src, v) => { if (v > 0) by.set(src, (by.get(src) || 0) + v); };
  const walk = (n, mult) => {
    const kids = n._ch || [];
    if (!kids.length) { add(n.source || '', (n.totalCOGS || 0) * mult); return; }
    const own = (n.totalCOGS || 0) / (n.qty || 1) - kids.reduce((s, c) => s + (c.totalCOGS || 0), 0);
    add(n.source || '', own * (n.qty || 1) * mult);
    kids.forEach(c => walk(c, mult * (n.qty || 1)));
  };
  (roots || []).forEach(n => walk(n, 1));
  const total = [...by.values()].reduce((s, v) => s + v, 0);
  const order = SOURCES.filter(x => x !== '').concat(['']);
  const parts = [...by.entries()].sort((a, b) => (order.indexOf(a[0]) === -1 ? 99 : order.indexOf(a[0])) - (order.indexOf(b[0]) === -1 ? 99 : order.indexOf(b[0])))
    .map(([source, cost]) => ({ source, label: gcsConfidenceLabel(source), cost, pct: total > 0 ? cost / total * 100 : 0, color: GCS_CONFIDENCE_COLORS[source] || '#64748b' }));
  return { total, parts };
};
const gcsConfidenceMerge = mixes => {
  const by = new Map(); (mixes || []).forEach(m => (m && m.parts || []).forEach(p => by.set(p.source, (by.get(p.source) || 0) + p.cost)));
  const fake = [...by.entries()].map(([source, cost]) => ({ source, totalCOGS: cost, qty: 1, _ch: [] }));
  return gcsConfidenceMix(fake);
};

// ── Commercial summary: per tab and project, Excel definitions ──
//   COGS  = landed cost of the tab's lines + provisions
//   Sales = line sales (after per-line discount) + provisions (sold at cost)
//   Contribution = Sales − COGS;  M&E = Sales × M&E%;  Gross margin = Contribution − M&E
//   S&A = Sales × S&A%;  EBITDA = Gross margin − S&A
//   Proposal price = Sales rounded UP to roundTo; discount = tab (or project) % × rounded price
//   Project EBITDA = Σ included tabs' EBITDA − discounts; gross margin likewise (Excel L6 = L5 + L4);
//   percentages are of pre-discount sales (Excel Summary K5/K6 divide by J35)
//   Shipping (outbound freight not built into prices) is its own contract line and, as in Excel,
//   is not part of EBITDA.
const computeGcsSummary = ({ tree, sheets, proj, pricing }) => {
  const idx = gcsSheetIndex(sheets);
  const mE = Number(proj.mAndE ?? 10) || 0, sA = Number(proj.sAndAExpense ?? 10) || 0;
  const roundTo = Number(proj.roundTo ?? GCS_DEFAULT_ROUND_TO) || 0;
  const projDiscount = Number(proj.gcsDiscount) || 0;
  const usd = v => conv(v, proj.sellCcy, 'USD', proj.rates);
  const { getAlloc, getItemSP, getItemNetPrice } = pricing;

  const tabs = idx.list.map(sheet => {
    const st = idx.byId.get(sheet.id);
    const roots = tree.filter(n => idx.idOf(n) === sheet.id);
    const lineCost = roots.reduce((s, n) => s + n.totalCOGS, 0);
    const lineLanded = roots.reduce((s, n) => s + getAlloc(n).landed, 0);
    const lineGross = roots.reduce((s, n) => s + getItemSP(n) * (n.qty || 1), 0);
    const lineSales = roots.reduce((s, n) => s + getItemNetPrice(n), 0);
    const subCost = code => roots.filter(n => n.subCat === code).reduce((s, n) => s + n.totalCOGS, 0);
    const p = st.provisions;
    const has = lineCost > 0;
    const fca = has ? lineCost * (Number(p.fcaPacking) || 0) / 100 : 0;
    const c5 = has ? subCost('C5') * (Number(p.c5Duty) || 0) / 100 : 0;
    const h1 = has ? subCost('H1') * (Number(p.h1Duty) || 0) / 100 : 0;
    const startup = has ? (lineSales + fca + c5 + h1) * (Number(p.startupRisk) || 0) / 100 : 0;
    const provisions = { startupRisk: startup, fcaPacking: fca, c5Duty: c5, h1Duty: h1 };
    const provTotal = startup + fca + c5 + h1;
    const cogs = lineLanded + provTotal;
    const sales = lineSales + provTotal;
    const contribution = sales - cogs;
    const mAndE = sales * mE / 100;
    const grossMargin = contribution - mAndE;
    const sAndA = sales * sA / 100;
    const ebitda = grossMargin - sAndA;
    const pct = v => (sales > 0 ? (v / sales) * 100 : 0);
    const price = gcsCeil(sales, roundTo);
    const discountPct = st.discount !== null && !isNaN(st.discount) ? st.discount : projDiscount;
    const discount = price * discountPct / 100;
    return { id: sheet.id, name: sheet.name, ...st, confidence: gcsConfidenceMix(roots), lineCount: roots.length, lineCost, lineLanded, lineGross,
      lineSales, provisions, provTotal, cogs, sales, contribution, mAndE, grossMargin, sAndA, ebitda,
      contributionPct: pct(contribution), grossMarginPct: pct(grossMargin), ebitdaPct: pct(ebitda),
      price, discountPct, discount };
  });

  const included = tabs.filter(t => t.include && t.lineCount > 0);
  const sum = k => included.reduce((s, t) => s + t[k], 0);
  const sales = sum('sales'), cogs = sum('cogs'), discount = sum('discount');
  const projectValueUSD = usd(sum('price'));
  tabs.forEach(t => {
    t.target = gcsSegmentTarget(t.segment || proj.segment, projectValueUSD);
    t.band = t.sales > 0 ? gcsBand(t.ebitdaPct, t.target) : '';
  });
  const targets = included.map(t => t.target).filter(v => v !== null && v !== undefined);
  const target = targets.length ? targets.reduce((s, v) => s + v, 0) / targets.length : null;
  const ebitda = sum('ebitda') - discount;
  const pct = v => (sales > 0 ? (v / sales) * 100 : 0);
  const shippingSell = pricing.distributeOutboundFreight ? 0 : (pricing.totalOutSP || 0);
  const shippingCost = pricing.distributeOutboundFreight ? 0 : (pricing.totalOutCost || 0);
  const shippingPrice = gcsCeil(shippingSell, roundTo);
  const contractBeforeDiscount = sum('price');
  const project = {
    sales, cogs, contribution: sales - cogs, mAndE: sum('mAndE'), grossMargin: sum('grossMargin') - discount, sAndA: sum('sAndA'),
    discount, ebitda, contributionPct: pct(sales - cogs), grossMarginPct: pct(sum('grossMargin') - discount),
    ebitdaPct: pct(ebitda), target, band: sales > 0 ? gcsBand(pct(ebitda), target) : '',
    contractBeforeDiscount, shippingSell, shippingCost, shippingPrice,
    contractValue: contractBeforeDiscount - discount + shippingPrice, projectValueUSD,
    confidence: gcsConfidenceMerge(included.map(t => t.confidence)),
  };
  return { tabs, project };
};

// Load-time conversion of files saved before the GCS method (PCW .pcw quotes and GCS v0.1 files).
// Runs once per file: the saved state carries gcsFormat afterwards. Every existing line becomes Custom
// with its old margin, and any contingency is folded into that margin, so no price changes on load.
const GCS_FORMAT = 1;
const gcsMigrateData = d => {
  if (!d || d.gcsFormat >= GCS_FORMAT || !Array.isArray(d.items)) return d;
  const items = d.items.map(i => {
    if (i.type === 'heading') return i;
    const folded = gcsFoldContingency(i);
    return folded.markupLevel ? folded : { ...folded, markupLevel: GCS_CUSTOM_LEVEL };
  });
  return { ...d, items, gcsFormat: GCS_FORMAT };
};


// ═══ AUTOMATIC COST FROM THE FEED, ANY BUSINESS UNIT (Excel GCS latest-cost lookup) ══════════════════════
// The latest positive PO/PQ cost for the part, from whichever BU bought or quoted it (feed costs are in USD),
// fills cost, cost date (so automatic inflation runs from it), supplier (if blank or auto-filled) and the cost
// source location (the BU). A typed cost is never overwritten. If the part has no PO/PQ, a pricelist cost the
// autofill wrote keeps working as before and its BU is recorded as the location.
const GCS_COST_TYPE_SHORT = { 'Purchase Order': 'PO', 'Purchase Quote': 'PQ', Pricelist: 'PL', EQD: 'EQD' };
// Provenance is only shown while the line still holds the cost it describes (a cost changed by paste, fill or
// find & replace then reads as typed).
const gcsCostProvenance = item => {
  const r = item && item.costRef;
  if (!r || !item.costLocation && !r.bu && r.type !== 'EQD') return null;
  if (r.cost !== undefined && Math.abs((Number(item.unitCost) || 0) - Number(r.cost)) > 1e-6) return null;
  if (r.cost !== undefined && (item.ccy || 'USD') !== (r.ccy || 'USD')) return null;
  return { location: item.costLocation || r.bu || '', type: r.type || '', short: GCS_COST_TYPE_SHORT[r.type] || r.type || '', doc: r.doc || '', date: r.date || '', supplier: r.supplier || '', qty: r.qty };
};
const gcsMayAutoCost = item => !gcsIsEqdLine(item) && (!(Number(item.unitCost) > 0) || item._autoPricelist === true || (item._autoCost === true && !!gcsCostProvenance(item)));
// r: the line as it will be after any other autofill updates; lc: DataService.getLatestCost result (or null).
// opts: keepSupplier (quote lines keep theirs), force (bulk refresh that may overwrite typed costs),
// clearIfNone (refresh: remove an automatic cost the feed no longer has), defaultSource.
const gcsCostFillPatch = (r, lc, plEntry, opts = {}) => {
  // EQD lines own their cost: only an explicit choice (the Cost Source picker) replaces it, and that ends EQD mode.
  if (gcsIsEqdLine(r) && !opts.explicit) return null;
  if (!opts.force && !gcsMayAutoCost(r)) return null;
  if (lc && lc.unitCost > 0) {
    const cost = parseFloat(Number(lc.unitCost).toFixed(4));
    const p = { unitCost: cost, ccy: 'USD', costDate: lc.date || '', costLocation: lc.bu || '', source: 'Project Cost',
      costRef: { type: lc.status || '', doc: lc.docNo || '', date: lc.date || '', qty: lc.qty, supplier: lc.supplier || '', bu: lc.bu || '', cost },
      _autoCost: true, _autoPricelist: false, manualSellPrice: null, ...(gcsIsEqdLine(r) ? { eqd: null } : {}) };
    if (!opts.keepSupplier && lc.supplier && (!r.supplier || r._autoSupplier === true)) { p.supplier = lc.supplier; p._autoSupplier = true; }
    return p;
  }
  if (r._autoPricelist === true && plEntry && plEntry.cost !== null && plEntry.cost !== undefined) {
    const cost = parseFloat(parseFloat(plEntry.cost).toFixed(4));
    return { costLocation: plEntry.sourceBU || '', costRef: { type: 'Pricelist', bu: plEntry.sourceBU || '', cost }, _autoCost: false };
  }
  if (opts.clearIfNone && r._autoCost === true) return { unitCost: 0, costDate: '', costLocation: '', costRef: null, _autoCost: false, source: opts.defaultSource || '' };
  return null;
};
const gcsFeedLatestCost = async pn => { try { return pn && DataService.getLatestCost ? await DataService.getLatestCost(pn) : null; } catch (e) { return null; } };

// A cost (or its currency) changed by hand — typing, paste, fill down: the line no longer holds the automatic
// cost, so its provenance is cleared (Excel modManualCostOverride) and a "Project Cost" source is cleared too,
// leaving the source for the user to set (the missing-source check then flags it). A source set in the same
// edit (e.g. a pasted Source column) is kept. Returns the extra fields to merge (empty object if none).
const gcsManualCostPatch = (item, patch) => {
  const out = {};
  const costChanged = patch.unitCost !== undefined && Number(patch.unitCost) !== Number(item.unitCost || 0);
  const ccyChanged = patch.ccy !== undefined && patch.ccy !== (item.ccy || 'USD');
  if (!costChanged && !ccyChanged) return out;
  if (item._autoCost || item.costLocation || item.costRef) { out._autoCost = false; out.costLocation = ''; out.costRef = null; }
  if (costChanged) {
    if (item._autoPricelist) out._autoPricelist = false;
    if (item.source === 'Project Cost' && patch.source === undefined) out.source = '';
  }
  return out;
};

// Inflation traffic light (how stale the reused cost is): < 5% green, 5% to under 10% amber, 10% and over red.
// Lines with no cost date and no typed inflation (nothing to judge) get no colour.
const GCS_INFLATION_BANDS = { amber: 5, red: 10 };
const gcsInflationBand = (pct, item) => {
  const v = Number(pct) || 0;
  if (!(item && (item.costDate || gcsHasValue(item.inflationPct))) && v === 0) return null;
  if (v >= GCS_INFLATION_BANDS.red) return { key: 'red', bg: '#fee2e2', fg: '#991b1b' };
  if (v >= GCS_INFLATION_BANDS.amber) return { key: 'amber', bg: '#fef9c3', fg: '#854d0e' };
  return { key: 'green', bg: '#dcfce7', fg: '#166534' };
};

// Category / sub-category name from its code (the costing column shows codes only; names go in tooltips).
const gcsCategoryName = code => { if (!code) return ''; const x = (code.length === 2 ? GCS_SUBCATEGORIES : GCS_CATEGORIES).find(c => c.code === code); return x ? x.name : ''; };

// Quote-readiness bar colour by % of lines complete: red < 33, amber 33-65, light green 66-99, green 100.
const gcsReadinessColor = pct => (pct >= 100 ? '#16a34a' : pct >= 66 ? '#65a30d' : pct >= 33 ? '#f59e0b' : '#dc2626');


// ═══ EQD: Equipment Quotations Database (Liquids) ═════════════════════════════════════════════════════════
// Excel macros modUnifiedEQDLookup / modLiquidsEQDProduction. Records come from the EQD sheet of the PCW feed
// (DataService.getEqd). A line enters EQD mode when Equipment, Material, Size and Vendor match a quote; the latest
// matching quote fills cost, currency, quote date (cost date → inflation), SAP item, description, model / drawing,
// supplier and size; automatic scaling then applies. Clearing EQD restores what the line held before.
const GCS_EQD_SEGMENT = 'Liquids';
const GCS_EQD_CCY_SYMBOLS = { '$': 'USD', 'US$': 'USD', '£': 'GBP', '€': 'EUR', 'R$': 'BRL', 'RMB': 'CNY', '¥': 'CNY' };
// "USD ($)", "U.S. Dollar (USD)", "EUR (€)", "RMB" → ISO code
const gcsEqdCcy = raw => {
  const s = String(raw || '').trim(); if (!s) return 'USD';
  const up = s.toUpperCase();
  const iso = up.match(/\b(USD|EUR|GBP|BRL|ARS|CNY|JPY|AUD|CAD|MXN|SGD|NOK|SEK|INR|CHF)\b/);
  if (iso) return iso[1];
  return GCS_EQD_CCY_SYMBOLS[s] || GCS_EQD_CCY_SYMBOLS[up] || (/^[A-Z]{3}$/.test(up) ? up : 'USD');
};
// Excel ValuesMatch: numeric if both numeric, else trimmed case-insensitive text
const gcsEqdSame = (a, b) => {
  const na = Number(a), nb = Number(b);
  if (String(a ?? '').trim() !== '' && String(b ?? '').trim() !== '' && !isNaN(na) && !isNaN(nb)) return Math.abs(na - nb) < 1e-7;
  return String(a ?? '').trim().toLowerCase() === String(b ?? '').trim().toLowerCase();
};
const gcsEqdSizeLabel = r => (r.size === '' || r.size === null || r.size === undefined ? '' : String(r.size) + (r.sizeUnits ? ' ' + r.sizeUnits : ''));
// Quotes matching the selection (blank fields = any), newest first; text filters any field
const gcsEqdQuery = (records, sel = {}) => {
  const q = String(sel.text || '').trim().toLowerCase();
  const out = (records || []).filter(r => (!sel.equipment || gcsEqdSame(r.equipment, sel.equipment)) && (!sel.material || gcsEqdSame(r.material, sel.material))
    && (sel.size === undefined || sel.size === '' || sel.size === null || gcsEqdSame(r.size, sel.size)) && (!sel.vendor || gcsEqdSame(r.vendor, sel.vendor))
    && (!q || [r.equipment, r.material, r.vendor, r.description, r.drawing, r.sap, r.quoteNo, r.category].some(v => String(v || '').toLowerCase().includes(q))));
  return out.sort((a, b) => String(b.date).localeCompare(String(a.date)) || (Number(b.id) || 0) - (Number(a.id) || 0));
};
const gcsEqdLatest = (records, sel) => (sel && sel.equipment && sel.material && sel.vendor && sel.size !== '' && sel.size !== undefined ? gcsEqdQuery(records, sel)[0] || null : null);
// Cascading choices: materials for the equipment, sizes for equipment + material, vendors for all three
const gcsEqdOptions = (records, sel = {}) => {
  const uniq = (arr, key) => { const m = new Map(); arr.forEach(r => { const v = r[key]; if (v === '' || v === null || v === undefined) return; const k = String(v).trim().toLowerCase(); if (!m.has(k)) m.set(k, v); }); return [...m.values()]; };
  const byText = (a, b) => String(a).localeCompare(String(b));
  const all = records || [];
  const e = sel.equipment ? all.filter(r => gcsEqdSame(r.equipment, sel.equipment)) : [];
  const em = sel.material ? e.filter(r => gcsEqdSame(r.material, sel.material)) : [];
  const ems = sel.size !== undefined && sel.size !== '' && sel.size !== null ? em.filter(r => gcsEqdSame(r.size, sel.size)) : [];
  return { equipment: uniq(all, 'equipment').sort(byText), material: uniq(e, 'material').sort(byText),
    size: uniq(em, 'size').sort((a, b) => (Number(a) - Number(b)) || byText(a, b)), vendor: uniq(ems, 'vendor').sort(byText) };
};
// Price in an app currency: kept if the app supports it; otherwise converted to USD with the project rates
// (per 1 USD). Returns null when there is no rate for it.
const gcsEqdPrice = (rec, rates) => {
  const ccy = rec.ccy || 'USD', price = Number(rec.price) || 0;
  if (CURRENCIES.includes(ccy)) return { unitCost: price, ccy, converted: null };
  const r = rates && Number(rates[ccy]);
  if (!(r > 0)) return null;
  return { unitCost: parseFloat((price / r).toFixed(4)), ccy: 'USD', converted: { from: ccy, price, rate: r } };
};
const GCS_EQD_PREV_FIELDS = ['partNumber', 'description', 'drawingNumber', 'supplier', 'unitCost', 'ccy', 'costDate', 'source', 'sizeCapacity', 'scalingFactor', 'costLocation', 'costRef', '_autoCost', '_autoSupplier', '_autoDescription', '_autoDrawing', '_autoPricelist'];
const gcsEqdPatch = (item, rec, rates) => {
  const pr = gcsEqdPrice(rec, rates);
  if (!pr) return null;
  const prev = item.eqd && item.eqd.prev ? item.eqd.prev : Object.fromEntries(GCS_EQD_PREV_FIELDS.map(k => [k, item[k] === undefined ? null : item[k]]));
  return {
    eqd: { equipment: rec.equipment, material: rec.material, size: rec.size, vendor: rec.vendor, id: rec.id ?? null, quoteNo: rec.quoteNo || '', vendorUrl: rec.vendorUrl || '',
      drawingUrl: rec.drawingUrl || '', category: rec.category || '', sizeUnits: rec.sizeUnits || '', converted: pr.converted, prev },
    partNumber: rec.sap ? String(rec.sap) : (item.partNumber || ''), description: rec.description || item.description || '', drawingNumber: rec.drawing || item.drawingNumber || '',
    supplier: rec.vendor || item.supplier || '', sizeCapacity: Number(rec.size) || 0, scalingFactor: null,
    unitCost: pr.unitCost, ccy: pr.ccy, costDate: rec.date || '', source: 'EQD', manualSellPrice: null,
    costLocation: rec.bidOffice || '', costRef: { type: 'EQD', doc: rec.quoteNo || '', date: rec.date || '', supplier: rec.vendor || '', bu: rec.bidOffice || '', cost: pr.unitCost, ccy: pr.ccy, url: rec.vendorUrl || '' },
    _autoCost: false, _autoPricelist: false, _autoSupplier: false, _autoDescription: !!rec.description, _autoDrawing: !!rec.drawing,
  };
};
// Leave EQD mode: restore the fields the line held before it entered
const gcsEqdClearPatch = item => {
  const prev = (item.eqd && item.eqd.prev) || {};
  const out = { eqd: null };
  GCS_EQD_PREV_FIELDS.forEach(k => { out[k] = prev[k] === undefined ? null : prev[k]; });
  ['partNumber', 'description', 'drawingNumber', 'supplier', 'source', 'costDate', 'costLocation'].forEach(k => { if (out[k] === null) out[k] = ''; });
  if (out.unitCost === null) out.unitCost = 0; if (out.ccy === null) out.ccy = 'USD'; if (out.sizeCapacity === null) out.sizeCapacity = 0;
  return out;
};


// ═══ SHARED PRICING ENGINE (no React) ═══════════════════════════════════════
// Freight allocation, landed cost, Brazil import/sales tax, outbound freight, packing & crating,
// sell prices and project totals. Pure functions of their inputs: no React, no DOM, no globals
// beyond the calc helpers above (conv, applyMargins, calcSiscomex, calcImportTax, calcSalesTax,
// calcICMSRate, freightTagEligibility, getFreightTags, getConfidence, BR_DEFAULTS).
// Called through usePricingEngine / useSalesTaxEngine (thin useMemo wrappers). Carried over from the PCW at the
// fork point; from here it develops separately, and PCW fixes are not picked up automatically.
//
// Arithmetic order is kept exactly as it was in the hooks so results are bit-identical.
// Per-node results (getAlloc, getItemSP) are cached by node object: each compute runs once per
// input change, and a tree node object never changes, so the cache cannot go stale. A caller that
// passes a copy of a node ({...n}) simply misses the cache and gets a fresh, identical result.

const computePricing = ({ tree, items, frt, proj, brazilTaxes, brazilStates, isCIT,
  forceAllocToPricelist, forceAllocToZeroCost, distributeOutboundFreight, distributePackingCrating, sheets }) => {
  const toSC = (amt, ccy) => conv(amt, ccy, proj.sellCcy, proj.rates);
  // GCS: margin comes from the line's markup level in its tab's markup table (or a Custom %); no contingency.
  const sheetIdx = gcsSheetIndex(sheets);
  const marginOf = n => gcsMarkupPct(n, sheetIdx.settingsOf(n));
  // GCS: a line has its markup when it uses a level (PASS = 0% is a deliberate choice) or a Custom % above 0, or a manual sell price.
  const hasMarkupOf = n => n.manualSellPrice > 0 || marginOf(n) > 0 || gcsLevelOf(n, sheetIdx.settingsOf(n)) !== GCS_CUSTOM_LEVEL;

  const topCOGS = tree.reduce((s, n) => s + n.totalCOGS, 0);
  const totalInbFrt = frt.inbound.reduce((s, e) => s + toSC(e.cost || 0, e.ccy || "USD"), 0);
  const inboundEntries = frt.inbound || [];

  // ── Brazil: Siscomex and AFRMM project totals ──
  const siscomex = (() => {
    if (!isCIT) return { numImported: 0, totalBRL: 0, totalSC: 0 };
    const numImported = items.filter(i => i.type !== "heading" && i.imported).length;
    if (proj.siscomexOverride !== null && proj.siscomexOverride !== undefined && proj.siscomexOverride >= 0) {
      return { numImported, totalBRL: proj.siscomexOverride, totalSC: conv(proj.siscomexOverride, "BRL", proj.sellCcy, proj.rates) };
    }
    const totalBRL = calcSiscomex(numImported);
    return { numImported, totalBRL, totalSC: conv(totalBRL, "BRL", proj.sellCcy, proj.rates) };
  })();
  const afrmm = (() => {
    if (!isCIT) return { applicableFreight: 0, totalAFRMM: 0, totalAFRMMSC: 0 };
    const applicableFreightBRL = frt.inbound.filter(e => e.afrmm)
      .reduce((s, e) => s + conv(e.cost || 0, e.ccy || "USD", "BRL", proj.rates), 0);
    const afrmmRate = proj.afrmmRate || 8;
    const totalAFRMMBRL = applicableFreightBRL * (afrmmRate / 100);
    return { applicableFreight: applicableFreightBRL, totalAFRMM: totalAFRMMBRL, totalAFRMMSC: conv(totalAFRMMBRL, "BRL", proj.sellCcy, proj.rates) };
  })();

  // ── Outbound freight (cost → sell, margin or markup mode) ──
  const outEntries = frt.outbound.map(e => {
    const cSC = toSC(e.cost || 0, e.ccy || "USD");
    const isMarkup = e.marginMode === "markup";
    const sSC = isMarkup ? cSC * (1 + (e.margin || 0) / 100)
      : (e.margin || 0) < 100 ? cSC / (1 - (e.margin || 0) / 100) : cSC;
    return { ...e, costSC: cSC, sellSC: sSC };
  });
  const totalOutSP = outEntries.reduce((s, e) => s + e.sellSC, 0);
  const totalOutCost = outEntries.reduce((s, e) => s + e.costSC, 0);
  const totalOutMargin = totalOutSP - totalOutCost;

  // ── Allocation bases (which root lines carry freight / Siscomex / AFRMM) ──
  const skipPL = n => n.source === "Pricelist" && !forceAllocToPricelist;
  const hasImp = n => n.imported || (n.importedSubCount || 0) > 0;
  const hasAfr = n => n.afrmm || (n.afrmmSubCount || 0) > 0;
  const eligibleCOGS = tree.reduce((s, n) => {
    if (skipPL(n)) return s;
    if (n.totalCOGS === 0 && !forceAllocToZeroCost.freight) return s;
    return s + n.totalCOGS;
  }, 0);
  const afrmmCOGS = tree.reduce((s, n) => {
    if (!hasAfr(n)) return s;
    if (skipPL(n)) return s;
    if (n.totalCOGS === 0 && !forceAllocToZeroCost.afrmm) return s;
    return s + n.totalCOGS;
  }, 0);
  const eligibleFreightCount = tree.reduce((c, n) => {
    if (skipPL(n)) return c;
    if (n.totalCOGS === 0 && !forceAllocToZeroCost.freight) return c;
    return c + 1;
  }, 0);
  const eligibleSiscomexCount = tree.reduce((c, n) => {
    if (!hasImp(n)) return c;
    if (skipPL(n)) return c;
    if (n.totalCOGS === 0 && !forceAllocToZeroCost.siscomex) return c;
    return c + 1;
  }, 0);
  const eligibleAfrmmCount = tree.reduce((c, n) => {
    if (!hasAfr(n)) return c;
    if (skipPL(n)) return c;
    if (n.totalCOGS === 0 && !forceAllocToZeroCost.afrmm) return c;
    return c + 1;
  }, 0);

  const flattenChildren = node => {
    const result = [];
    const walk = n => { n._ch && n._ch.forEach(c => { result.push(c); walk(c); }); };
    walk(node);
    return result;
  };

  // Supplier-tagged inbound freight eligibility, computed once. Feeds both the allocation (getAlloc)
  // and the freight warnings, so they always agree. Walks the BOM per root (see freightTagEligibility).
  const freightTagInfo = new Map();
  inboundEntries.forEach(entry => {
    const tags = getFreightTags(entry);
    if (!tags.length) return;
    freightTagInfo.set(entry.id, { tags, ...freightTagEligibility(tree, tags, forceAllocToPricelist, forceAllocToZeroCost) });
  });
  const freightTagStatus = new Map();
  inboundEntries.forEach(entry => {
    const info = freightTagInfo.get(entry.id);
    if (!info) return;
    const costSC = toSC(entry.cost || 0, entry.ccy || "USD");
    const problems = info.tags.filter(t => !(info.eligibleByTag[t.toLowerCase()] > 0))
      .map(t => ({ tag: t, hasItems: info.itemCountByTag[t.toLowerCase()] > 0 }));
    freightTagStatus.set(entry.id, { tags: info.tags, costSC, allocated: info.total > 0, problems });
  });
  // Per-entry values used for every line: worked out once, not once per line.
  const inboundPrepared = inboundEntries.map(entry => ({
    entry, tags: getFreightTags(entry), costSC: toSC(entry.cost || 0, entry.ccy || "USD"),
  }));

  // ── Landed cost of one node: COGS + inbound freight + Siscomex + AFRMM + import tax + tariff ──
  const allocCache = new WeakMap();
  const computeAlloc = n => {
    const isPL = n.source === "Pricelist";
    const isZeroCost = n.totalCOGS === 0;
    const skipAlloc = isPL && !forceAllocToPricelist;
    let fr = 0;
    if (!skipAlloc) {
      if (isZeroCost && !forceAllocToZeroCost.freight) {
        fr = 0;
      } else {
        inboundPrepared.forEach(({ entry, tags, costSC: entryCostSC }) => {
          if (!entryCostSC) return;
          if (tags.length) {
            // Tagged entry: only items from the tagged supplier(s) carry it, weighted by COGS across all of them
            const tagInfo = freightTagInfo.get(entry.id);
            const tagSlice = tagInfo && tagInfo.total > 0 ? (tagInfo.sliceByNode.get(n.id) || 0) : 0;
            if (tagSlice > 0) fr += (tagSlice / tagInfo.total) * entryCostSC;
          } else {
            // Untagged entry: allocate across all eligible items
            if (eligibleCOGS > 0) fr += (n.totalCOGS / eligibleCOGS) * entryCostSC;
            else if (eligibleFreightCount > 0) fr += entryCostSC / eligibleFreightCount;
          }
        });
      }
    }
    let siscomexAlloc = 0;
    if (!skipAlloc && isCIT && hasImp(n)) {
      if (isZeroCost && !forceAllocToZeroCost.siscomex) siscomexAlloc = 0;
      // Siscomex allocated equally per unique imported item, not by value
      else if (eligibleSiscomexCount > 0) siscomexAlloc = (siscomex.totalSC || 0) / eligibleSiscomexCount;
    }
    let afrmAlloc = 0;
    if (!skipAlloc && isCIT && hasAfr(n)) {
      if (isZeroCost && !forceAllocToZeroCost.afrmm) afrmAlloc = 0;
      else if (afrmmCOGS > 0) afrmAlloc = (n.totalCOGS / afrmmCOGS) * (afrmm.totalAFRMMSC || 0);
      else if (eligibleAfrmmCount > 0) afrmAlloc = (afrmm.totalAFRMMSC || 0) / eligibleAfrmmCount;
    }
    const cif = n.totalCOGS + fr;
    const tar = n.totalCOGS * ((n.tariff || 0) / 100);
    const allDescendants = flattenChildren(n);
    const importedDescendants = allDescendants.filter(c => c.imported);
    const afrmmDescendants = allDescendants.filter(c => c.afrmm);
    const totalImportedCOGSUnder = importedDescendants.reduce((s, c) => s + c.totalCOGS, 0);
    const totalAfrmmCOGSUnder = afrmmDescendants.reduce((s, c) => s + c.totalCOGS, 0);
    const importedChildrenWithCIF = importedDescendants.map(c => {
      const childSiscomex = siscomexAlloc > 0 && totalImportedCOGSUnder > 0 ? (c.totalCOGS / totalImportedCOGSUnder) * siscomexAlloc : 0;
      const childAFRMM = c.afrmm && afrmAlloc > 0 && totalAfrmmCOGSUnder > 0 ? (c.totalCOGS / totalAfrmmCOGSUnder) * afrmAlloc : 0;
      return { ...c, childSiscomex, childAFRMM, cifForTax: c.totalCOGS + childSiscomex + childAFRMM };
    });
    let importTax = 0;
    if (!skipAlloc && isCIT) {
      if (n.imported) {
        const cifBRL = conv(cif, proj.sellCcy, "BRL", proj.rates);
        const tc = brazilTaxes[n.id] || {};
        const br = calcImportTax(cifBRL, n.customsCharges ?? proj.customsCharges ?? 9, tc.ii ?? 20);
        importTax += conv(br.total, "BRL", proj.sellCcy, proj.rates);
      }
      importedChildrenWithCIF.forEach(c => {
        const cifBRL = conv(c.cifForTax, proj.sellCcy, "BRL", proj.rates);
        const tc = brazilTaxes[c.id] || {};
        const br = calcImportTax(cifBRL, c.customsCharges ?? proj.customsCharges ?? 9, tc.ii ?? 20);
        importTax += conv(br.total, "BRL", proj.sellCcy, proj.rates);
      });
    }
    return {
      fr, siscomex: siscomexAlloc, afrmm: afrmAlloc, cif, tax: importTax, tar,
      landed: n.totalCOGS + fr + siscomexAlloc + afrmAlloc + importTax + tar,
      importedChildren: isCIT ? importedChildrenWithCIF : [],
    };
  };
  const getAlloc = n => {
    let a = allocCache.get(n);
    if (!a) { a = computeAlloc(n); allocCache.set(n, a); }
    return a;
  };
  const allocMap = new Map();
  const visitAll = (fn) => { const v = n => { fn(n); (n._ch || []).forEach(v); }; tree.forEach(v); };
  visitAll(n => allocMap.set(n.id, getAlloc(n)));

  // Base sell price of a root line (before outbound freight / P&C distribution and discount)
  const baseLineSP = item => {
    if (item.manualSellPrice !== null && item.manualSellPrice !== undefined) return item.manualSellPrice * (item.qty || 1);
    const a = getAlloc(item);
    return applyMargins(a.landed, { margin: marginOf(item), contingency: 0,
      dealer: proj.defaultDealer || 0, discountMitigation: proj.discountMitigation || 0 });
  };

  const outboundFreightAllocations = (() => {
    if (!distributeOutboundFreight || totalOutSP === 0 || tree.length === 0) return {};
    let totalBaseSP = 0;
    const baseSPs = {};
    tree.forEach(item => { const b = baseLineSP(item); baseSPs[item.id] = b; totalBaseSP += b; });
    if (totalBaseSP === 0) return {};
    const allocations = {};
    tree.forEach(item => { allocations[item.id] = (baseSPs[item.id] / totalBaseSP) * totalOutSP; });
    return allocations;
  })();

  // ── Packing & Crating ──
  const pc = frt.packingCrating || {};
  // GCS: packing & crating removed; the per-tab FCA/Packing provision replaces it (computeGcsSummary).
  const pcActive = false;
  // pcBaseSPs: item base sell prices (pre-outbound-freight, pre-discount) for the % calculation
  const pcBaseSPs = (() => {
    const map = {};
    let total = 0;
    tree.forEach(item => { const b = baseLineSP(item); map[item.id] = b; total += b; });
    return { map, total };
  })();
  const pcTotal = (() => {
    if (!pcActive) return 0;
    const pcMode = pc.mode || "pct";
    if (pcMode === "cost") {
      const costSC = toSC(parseFloat(pc.cost) || 0, pc.costCcy || "USD");
      const margin = pc.margin || 0;
      const isMarkup = pc.marginMode === "markup";
      return isMarkup ? costSC * (1 + margin / 100) : margin > 0 && margin < 100 ? costSC / (1 - margin / 100) : costSC;
    }
    if (pcMode === "fixed") return parseFloat(pc.overrideAmt) || 0;
    return pcBaseSPs.total * ((pc.pct || 0) / 100); // % of total base sell price (pre-discount)
  })();
  const packingCratingAllocations = (() => {
    if (!pcActive || !distributePackingCrating || pcTotal === 0 || pcBaseSPs.total === 0) return {};
    const allocs = {};
    tree.forEach(item => { allocs[item.id] = (pcBaseSPs.map[item.id] / pcBaseSPs.total) * pcTotal; });
    return allocs;
  })();

  // ── Sell prices ──
  const spCache = new WeakMap();
  const computeItemSP = n => {
    let baseSP;
    if (n.manualSellPrice !== null && n.manualSellPrice !== undefined) {
      baseSP = n.manualSellPrice;
    } else {
      const a = getAlloc(n);
      const totalSP = applyMargins(a.landed, { margin: marginOf(n), contingency: 0,
        dealer: proj.defaultDealer || 0, discountMitigation: proj.discountMitigation || 0 });
      baseSP = totalSP / (n.qty || 1);
    }
    if (distributeOutboundFreight && outboundFreightAllocations[n.id]) baseSP += outboundFreightAllocations[n.id] / (n.qty || 1);
    if (pcActive && (distributeOutboundFreight || distributePackingCrating) && packingCratingAllocations[n.id]) {
      baseSP += packingCratingAllocations[n.id] / (n.qty || 1);
    }
    return baseSP;
  };
  const getItemSP = n => {
    let v = spCache.get(n);
    if (v === undefined) { v = computeItemSP(n); spCache.set(n, v); }
    return v;
  };
  const getItemNetPrice = n => getItemSP(n) * (n.qty || 1) * (1 - (n.discount || 0) / 100);
  const getItemSPWithSalesTax = n => {
    const sp = getItemSP(n);
    if (!isCIT) return sp;
    const discountedSP = sp * (1 - (n.discount || 0) / 100);
    const spBRL = conv(discountedSP, proj.sellCcy, "BRL", proj.rates);
    const icmsRate = calcICMSRate(brazilStates.origin, brazilStates.destination);
    const tc = { ...BR_DEFAULTS, icms: icmsRate, ...(brazilTaxes[n.id] || {}) };
    const salesTax = calcSalesTax(spBRL, tc);
    return discountedSP + conv(salesTax.total, "BRL", proj.sellCcy, proj.rates);
  };

  // Pre-computed per-row maps (O(1) lookup per row)
  const spMap = new Map();
  visitAll(n => spMap.set(n.id, getItemSP(n)));
  const netPriceMap = new Map();
  visitAll(n => { const sp = spMap.get(n.id) ?? 0; netPriceMap.set(n.id, sp * (n.qty || 1) * (1 - (n.discount || 0) / 100)); });
  const spTaxMap = new Map();
  if (isCIT) visitAll(n => spTaxMap.set(n.id, getItemSPWithSalesTax(n)));

  // Quote-ready flags (drive the row completion colours)
  const quoteReadyMap = new Map();
  const nodeReady = n => {
    if (!n._ch || n._ch.length === 0) return !!(n.partNumber?.trim() && n.description?.trim() && n.supplier?.trim() && n.unitCost > 0);
    return !!(n.partNumber?.trim() && n.description?.trim()) && n._ch.every(c => nodeReady(c));
  };
  visitAll(n => {
    const isParent = n._ch && n._ch.length > 0;
    const ready = isParent
      ? !!(n.partNumber?.trim() && n.description?.trim() && hasMarkupOf(n)) && n._ch.every(c => nodeReady(c))
      : !!(n.partNumber?.trim() && n.description?.trim() && n.supplier?.trim() && n.unitCost > 0 && hasMarkupOf(n));
    quoteReadyMap.set(n.id, ready);
  });

  // Margin % that gives a target unit sell price (exact inverse of applyMargins)
  const calculateReverseMargin = (n, targetSellPrice) => {
    const a = getAlloc(n);
    const landed = a.landed / (n.qty || 1);
    if (landed === 0) return 0;
    const contingency = 0; // GCS: no contingency (replaced by inflation and scaling factors)
    const dealer = proj.defaultDealer || 0;
    const discountMitig = proj.discountMitigation || 0;
    let backedOutSP = targetSellPrice;
    if (discountMitig > 0 && discountMitig < 100) backedOutSP *= 1 - discountMitig / 100;
    if (dealer > 0 && dealer < 100) backedOutSP *= 1 - dealer / 100;
    if (contingency > 0 && contingency < 100) backedOutSP *= 1 - contingency / 100;
    if (backedOutSP === 0) return 0;
    return (1 - landed / backedOutSP) * 100;
  };

  // ── Project totals ──
  const landedCOGS = tree.reduce((s, n) => s + (allocMap.get(n.id)?.landed ?? 0), 0);
  const itemsSP = tree.reduce((s, n) => s + getItemNetPrice(n), 0);
  const grand = itemsSP + (distributeOutboundFreight ? 0 : totalOutSP)
    + (distributeOutboundFreight || distributePackingCrating ? 0 : pcTotal);
  const itemsSPWithTax = !isCIT ? itemsSP : tree.reduce((s, n) => s + getItemSPWithSalesTax(n) * (n.qty || 1), 0);
  const freightTaxSC = (() => {
    if (!isCIT || totalOutSP === 0 || distributeOutboundFreight) return 0;
    const outFreightBRL = conv(totalOutSP, proj.sellCcy, "BRL", proj.rates);
    const freightSalesTax = calcSalesTax(outFreightBRL, BR_DEFAULTS);
    return conv(freightSalesTax.total, "BRL", proj.sellCcy, proj.rates);
  })();
  const totalOutSPWithTax = (!isCIT || totalOutSP === 0 || distributeOutboundFreight) ? 0 : totalOutSP + freightTaxSC;
  const grandWithTax = isCIT ? itemsSPWithTax + totalOutSPWithTax : grand;

  return {
    topCOGS, totalInbFrt, freightTagStatus, siscomex, afrmm, outEntries, totalOutSP, totalOutCost, totalOutMargin,
    marginOf, hasMarkupOf, getAlloc, allocMap, spMap, netPriceMap, spTaxMap, quoteReadyMap, getItemSP, getItemNetPrice, getItemSPWithSalesTax,
    calculateReverseMargin, landedCOGS, itemsSP, grand, itemsSPWithTax, totalOutSPWithTax, grandWithTax, freightTaxSC,
    outboundFreightAllocations, packingCratingAllocations, pcActive, pcTotal, pcBaseSPs, distributeOutboundFreight,
  };
};

// Brazil sales tax, import tax detail, discounts and margin breakdowns. Takes the computePricing result.
const computeSalesTax = ({ tree, items, proj, brazilTaxes, brazilStates, isCIT, pricing, distributeOutboundFreight }) => {
  const { getItemSP, getItemNetPrice, getAlloc, landedCOGS, itemsSP, totalOutSP, freightTaxSC } = pricing;
  const itemById = new Map();
  items.forEach(i => { if (!itemById.has(i.id)) itemById.set(i.id, i); });
  const getBT = id => {
    const item = itemById.get(id);
    const stateICMS = calcICMSRate(brazilStates.origin, brazilStates.destination);
    // Direct sale + imported item = 4% ICMS regardless of state configuration
    const defaultICMS = proj.salesType === "Direct" && item?.imported === true ? 4 : stateICMS;
    return { ...BR_DEFAULTS, icms: defaultICMS, ...(brazilTaxes[id] || {}) };
  };
  const getItemSalesTax = item => {
    if (!isCIT) return { ipi: 0, pis: 0, cofins: 0, icms: 0, total: 0 };
    const sp = getItemSP(item);
    const discountedSP = sp * (1 - (item.discount || 0) / 100);
    const spBRL = conv(discountedSP, proj.sellCcy, "BRL", proj.rates);
    return calcSalesTax(spBRL, getBT(item.id));
  };
  const getItemImportTaxDetail = item => {
    if (!isCIT) return { customs: 0, ii: 0, total: 0 };
    const alloc = getAlloc(item);
    let customs = 0, ii = 0;
    if (item.imported) {
      const cifBRL = conv(alloc.cif, proj.sellCcy, "BRL", proj.rates);
      const tc = getBT(item.id);
      const bt = calcImportTax(cifBRL, item.customsCharges ?? proj.customsCharges ?? 9, tc.ii ?? 20);
      customs += bt.customs; ii += bt.ii;
    }
    (alloc.importedChildren || []).forEach(c => {
      const cifBRL = conv(c.cifForTax ?? c.totalCOGS, proj.sellCcy, "BRL", proj.rates);
      const tc = getBT(c.id);
      const bt = calcImportTax(cifBRL, c.customsCharges ?? proj.customsCharges ?? 9, tc.ii ?? 20);
      customs += bt.customs; ii += bt.ii;
    });
    return { customs, ii, total: customs + ii };
  };

  let totalImportTax = 0, totalSalesTax = 0, totalTax = 0;
  const salesTaxTotals = { ipi: 0, pis: 0, cofins: 0, icms: 0, total: 0 };
  if (isCIT) {
    tree.forEach(item => {
      const alloc = getAlloc(item);
      totalImportTax += alloc.tax + alloc.siscomex + alloc.afrmm;
      const st = getItemSalesTax(item);
      const qty = item.qty || 1;
      totalSalesTax += conv(st.total * qty, "BRL", proj.sellCcy, proj.rates); // sell currency, for the build-up total
      salesTaxTotals.ipi += st.ipi * qty;  // BRL, for the Brazil tax breakdown display
      salesTaxTotals.pis += st.pis * qty;
      salesTaxTotals.cofins += st.cofins * qty;
      salesTaxTotals.icms += st.icms * qty;
      salesTaxTotals.total += st.total * qty;
    });
    if (!distributeOutboundFreight && totalOutSP > 0 && freightTaxSC > 0) {
      totalSalesTax += freightTaxSC;
      salesTaxTotals.total += conv(freightTaxSC, proj.sellCcy, "BRL", proj.rates);
    }
    totalTax = totalImportTax;
  } else {
    totalTax = tree.reduce((s, n) => s + n.totalCOGS * ((n.tariff || 0) / 100), 0);
  }

  const totalDiscount = tree.reduce((sum, item) => {
    const unitSP = getItemSP(item);
    const discountPct = item.discount || 0;
    if (discountPct === 0) return sum;
    return sum + unitSP * (item.qty || 1) * (discountPct / 100);
  }, 0);
  const buildUpGrossMargin = itemsSP - landedCOGS + totalDiscount;

  const marginByConfidence = { "Very High": [], High: [], Medium: [], Low: [], "Very Low": [] };
  tree.forEach(n => {
    const a = getAlloc(n);
    const netPrice = getItemNetPrice(n);
    const margin = netPrice > 0 ? ((netPrice - a.landed) / netPrice) * 100 : 0;
    const conf = getConfidence(n.source);
    if (marginByConfidence[conf]) marginByConfidence[conf].push({ item: n, margin, value: netPrice });
  });
  const marginBySupplier = {};
  const addSupplier = n => {
    if ((n._ch || []).length > 0) { n._ch.forEach(addSupplier); return; }
    if (n.supplier) {
      const a = getAlloc(n);
      const netPrice = getItemNetPrice(n);
      const margin = netPrice > 0 ? ((netPrice - a.landed) / netPrice) * 100 : 0;
      if (!marginBySupplier[n.supplier]) marginBySupplier[n.supplier] = { items: 0, totalMargin: 0, totalValue: 0 };
      marginBySupplier[n.supplier].items++;
      marginBySupplier[n.supplier].totalMargin += margin;
      marginBySupplier[n.supplier].totalValue += netPrice;
    }
  };
  tree.forEach(addSupplier);

  return { totalImportTax, totalSalesTax, totalTax, salesTaxTotals, totalDiscount, buildUpGrossMargin,
    getBT, getItemSalesTax, getItemImportTaxDetail, marginByConfidence, marginBySupplier };
};

const LS_KEY_FEED    = (APP_ID+'-feed-name');    // connected filename
const LS_KEY_COLMAPS = (APP_ID+'-fs-colmaps');  // stored column overrides
const IDB_KEY_HANDLE      = (APP_ID+'-file-handle');      // IndexedDB key for feed file handle
const IDB_KEY_SAVE_HANDLE = (APP_ID+'-save-file-handle'); // IndexedDB key for auto-save file handle

// Minimal IndexedDB helpers for storing/retrieving the file handle
// (localStorage can't store non-serialisable objects like FileSystemFileHandle)
const _idb = (() => {
 let _db = null;
 const open = () => new Promise((res, rej) => {
  if (_db) return res(_db);
  const req = indexedDB.open((APP_ID+'-store'), 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore('kv');
  req.onsuccess = e => { _db = e.target.result; res(_db); };
  req.onerror = () => rej(req.error);
 });
 return {
  async get(key) {
   try {
   const db = await open();
   return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readonly');
    const req = tx.objectStore('kv').get(key);
    req.onsuccess = () => res(req.result ?? null);
    req.onerror = () => rej(req.error);
   });
   } catch(e) { return null; }
  },
  async set(key, value) {
   try {
   const db = await open();
   return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    const req = tx.objectStore('kv').put(value, key);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
   });
   } catch(e) {}
  },
  async del(key) {
   try {
   const db = await open();
   return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    const req = tx.objectStore('kv').delete(key);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
   });
   } catch(e) {}
  },
 };
})();

function detectColIdx(headers, candidates) {
const lc = headers.map(h => (h||'').toString().toLowerCase().trim());
for (const c of candidates) {
 const i = lc.findIndex(h => h === c);
 if (i !== -1) return i;
}
for (const c of candidates) {
 const i = lc.findIndex(h => h.includes(c));
 if (i !== -1) return i;
}
return -1;
}

function buildColMap(headers, fieldDefs) {
const map = {};
for (const [field, candidates] of Object.entries(fieldDefs)) {
 map[field] = detectColIdx(headers, candidates);
}
return map;
}

function mapSheetRow(row, colMap) {
const out = {};
for (const [field, idx] of Object.entries(colMap)) {
 if (idx >= 0 && row[idx] !== undefined && row[idx] !== null && row[idx] !== '') {
 out[field] = row[idx];
 }
}
return out;
}

function fmtDate(v) {
if (!v) return '';
if (v instanceof Date) return v.toISOString().slice(0,10);
if (typeof v === 'number') {
 const d = new Date(Math.round((v - 25569) * 86400 * 1000));
 return d.toISOString().slice(0,10);
}
return v.toString().slice(0,10);
}

function parsePrice(v) {
if (v === null || v === undefined || v === '') return 0;
if (v instanceof Date) {
 if (v.getFullYear() < 1980) {
 const serial = Math.round((v.getTime() / 86400000) + 25569);
 return serial > 0 ? serial : 0;
 }
 return 0; // A real date in a price field — shouldn't happen, return 0
}
if (typeof v === 'string' && /^1[89]\d\d-\d\d-\d\d$/.test(v)) {
 const d = new Date(v);
 if (!isNaN(d) && d.getFullYear() < 1980) {
 const serial = Math.round((d.getTime() / 86400000) + 25569);
 return serial > 0 ? serial : 0;
 }
}
return parseFloat(v) || 0;
}

async function readAllSheets(forceRead = false) {
 if (!_handle) return null;

 if (!XLSXlib) { console.error('[GCS] XLSX library not available'); return null; }
 if (_wbCache && !forceRead) return _wbCache;

 _readInFlight = (async () => {

   }

  const buf  = await file.arrayBuffer();
  _wbCache = XLSXlib.read(buf, {type:'array'});

}

function matchSheet(wb, sheetKey) {
 const def  = FEED_SHEET_DEFS[sheetKey];
 const names = wb.SheetNames.map(n => n.toLowerCase().trim());
 for (const match of def.sheetMatch) {
 const idx = names.findIndex(n => n === match || n.includes(match));
 if (idx !== -1) return wb.SheetNames[idx];
 }
 return null; // sheet not found — caller must handle null
}

async function loadSheet(sheetKey, forceRefresh) {
 if (_cache[sheetKey] && !forceRefresh) return _cache[sheetKey];
 if (!_handle) return null;
 const wb = await readAllSheets();
 if (!wb) return null;
 const sheetName = matchSheet(wb, sheetKey);
 if (!sheetName) return null; // sheet not present in this workbook
 const ws        = wb.Sheets[sheetName];
 const rows      = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
 if (rows.length < 2) return [];
 const headers = rows[0].map(h => (h||'').toString());

 try {
 const hc = JSON.parse(localStorage.getItem((APP_ID+'-fs-headers')) || '{}');
 const prevHeaders = hc[sheetKey];
 const headersChanged = prevHeaders && JSON.stringify(prevHeaders) !== JSON.stringify(headers);
 if (headersChanged) {
  const maps = getColMaps() || {};
  if (maps[sheetKey]) {
  delete maps[sheetKey];
  saveColMaps(maps);
  }
 }
 hc[sheetKey] = headers;
 localStorage.setItem((APP_ID+'-fs-headers'), JSON.stringify(hc));
 } catch(e) {}

 const overrides = (getColMaps() || {})[sheetKey] || {};
 const autoDef   = buildColMap(headers, FEED_SHEET_DEFS[sheetKey].fields);
 const colMap    = {...autoDef, ...overrides};
 const data = rows.slice(1).map(row => mapSheetRow(row, colMap));
 _cache[sheetKey] = data;
 // Free this sheet's raw parsed cell data now that the lightweight row cache
 // exists — SheetJS's per-cell objects (type/style/formula metadata) are far
 // heavier than the plain-object rows we actually use, and matchSheet() only
 // reads wb.SheetNames (not wb.Sheets), so other not-yet-loaded sheets are unaffected.
 delete wb.Sheets[sheetName];
 return data;
}

// Returns currency for a supplier by name match, or null if not found
async function lookupSupplierBPCurrency(supplierName) {

 // Exact match first, then case-insensitive
 for (const [, entry] of Object.entries(map)) {

async function buildPartIndex() {
 if (_partIndex._built) return;
 const map = {};
 function updatePart(itemNo, description, supplierName, db, date, drawing) {
  if (!itemNo) return;
  const key = itemNo.toString().trim().toUpperCase();
  if (!key) return;
  const d = fmtDate(date);
  const drawingStr = drawing != null ? drawing.toString().trim() : '';
  if (!map[key]) {
   map[key] = {itemNo: itemNo.toString().trim(), description: description || '', supplier: supplierName || '', drawing: drawingStr, bus: new Set(), latestDate: d};
  } else {
   if (d && (!map[key].latestDate || d > map[key].latestDate)) {
    map[key].description = description || map[key].description;
    map[key].supplier = supplierName || map[key].supplier;
    map[key].drawing  = drawingStr   || map[key].drawing;
    map[key].latestDate = d;
   }
  }
  map[key].bus.add(normDB(db));
 }
 const po = await loadSheet('purchaseOrders', false);
 if (po) { for (const r of po) { updatePart(r.itemNo, r.description, r.supplierName, r.db, r.date, r.drawing); } }
 const pq = await loadSheet('purchaseQuotes', false);
 if (pq) { for (const r of pq) { updatePart(r.itemNo, r.description, r.supplierName, r.db, r.date, r.drawing); } }

 if (sq) { for (const r of sq) { updatePart(r.itemNo, r.description, r.supplierName, r.db, r.date, r.drawing); } }

 _partIndex._built = true;
}

const _gcsLatestIdx = new WeakMap();
const _gcsEqdIdx = new WeakMap();
function gcsLatestCostIndex(rows, status, docKey) {
 let m = _gcsLatestIdx.get(rows);
 if (m) return m;
 m = new Map(); m.byBu = new Map();
 for (const r of rows) {
  const pn = (r.itemNo || '').toString().toLowerCase().trim();
  if (!pn || !r.unitPrice) continue;
  const unitCost = parsePrice(r.unitPrice);
  if (!(unitCost > 0)) continue;
  const date = fmtDate(r.date) || '';
  const rec = { partNumber: r.itemNo.toString(), unitCost, ccy: 'USD', date, supplier: r.supplierName || '', docNo: (r[docKey] || '').toString(), status, qty: parseFloat(r.qty) || 1, bu: normDB(r.db) };
  const perBu = m.byBu.get(pn) || (m.byBu.set(pn, new Map()), m.byBu.get(pn));
  const cb = perBu.get(rec.bu); if (!cb || cb.date < date) perBu.set(rec.bu, rec);
  const cur = m.get(pn);
  if (cur && cur.date >= date) continue;
  m.set(pn, rec);
 }
 m.byBu.forEach((v, k) => m.byBu.set(k, [...v.values()]));
 _gcsLatestIdx.set(rows, m);
 return m;
}

function normDB(db) {
 if (!db) return '';
 const s = db.toString().trim().toUpperCase();
 if (/^[A-Z]{2,4}$/.test(s)) return s;
 return s.split('_')[0];
}

function dbMatchesBU(db, bu) {
 if (!bu) return true;
 return normDB(db) === bu.toString().toUpperCase();
}

 // Attempt to restore a previously used handle without showing the picker.
 // Returns the filename if successful, null if no saved handle or permission denied.

 try {
  const handle = await _idb.get(IDB_KEY_HANDLE);

  if (handle.queryPermission) perm = await handle.queryPermission({ mode: 'read' });

   if (result !== 'granted') return null;
   } else { return null; }

  _handle   = handle;
  _fileName = handle.name;
  Object.keys(_cache).forEach(k => delete _cache[k]);
  _wbCache = null; _ipiMap = null;
  _bpIndex.customers = null; _bpIndex.suppliers = null; _bpIndex._built = false; _bpDetails.data = null;

 async searchCustomers(query, bu) {

 async function searchSheets(buFilter) {

 let result = await searchSheets(bu);

 const target = {
  icms:      r(icms),

  ipi:       r(ipi),
  pis:       r(pis),
  cofins:    r(cofins),

 const sampleRow = rows.find(r => r.code);
 const hasBasisCol     = sampleRow && sampleRow.icmsBasis     !== undefined;
 const hasEffectiveCol = sampleRow && sampleRow.icmsEffective !== undefined;
 const match = rows.find(row => {
  if (!row.code) return false;
  const icmsMatch   = r((row.icms||0)*100)   === target.icms;
  const ipiMatch    = r((row.ipi||0)*100)    === target.ipi;

  basisMatch = r((row.icmsBasis||0)*100) === target.icmsBasis;

  const derivedBasis = r(((row.icmsEffective||0) / (row.icms||1)) * 100);
  basisMatch = derivedBasis === target.icmsBasis;
  } else {
  basisMatch = true; // can't check — skip

  return icmsMatch && basisMatch && ipiMatch && pisMatch && cofinsMatch;
 });

 async lookupPricelist(partNumber, bu) {

 if (!FIELDS[buUp]) return null;
 const pl = await loadSheet('pricelists', false);
 if (!pl) return null;
 const row = pl.find(r => (r.itemNo||'').toString().toLowerCase().trim() === pn);

  const f = FIELDS[b];
  const cost   = row[f.cost]   !== undefined && row[f.cost]   !== '' ? parseFloat(row[f.cost])   : null;
  const margin = row[f.margin] !== undefined && row[f.margin] !== '' ? parseFloat(row[f.margin]) : null;
  return (cost === null && margin === null) ? null : { cost, margin };
 };

 const FALLBACK_ORDER = ['CIW','ECL','CIT','CIA'];
 const tryOrder = [buUp, ...FALLBACK_ORDER.filter(b => b !== buUp)];
