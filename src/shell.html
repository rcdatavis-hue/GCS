  <!-- Skeleton screen styles -->
  <style>
    #pcw-skeleton {
      position: fixed; inset: 0; background: #f8fafc; z-index: 9999;
      display: flex; flex-direction: column; font-family: Arial, sans-serif;
    }
    #pcw-skeleton.hidden { display: none; }
    .sk-bar { background: #e2e8f0; border-radius: 4px; animation: sk-pulse 1.4s ease-in-out infinite; }
    @keyframes sk-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
    .sk-header { background: #1e3a5f; height: 52px; display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0; }
    .sk-tabs { background: #fff; height: 40px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: flex-end; padding: 0 16px; gap: 4px; flex-shrink: 0; }
    .sk-tab { height: 32px; width: 80px; border-radius: 6px 6px 0 0; }
    .sk-tab.active { background: #2563eb; animation: none; }
    .sk-content { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
    .sk-row { height: 36px; width: 100%; border-radius: 4px; }
    .sk-row.narrow { width: 60%; }
  </style>

<body style="margin:0;padding:0;overflow:hidden;min-height:100vh;background:#f1f5f9;">
  <!-- Skeleton shown immediately, dismissed once React mounts -->
  <div id="pcw-skeleton">
    <div class="sk-header">
      <div class="sk-bar" style="width:180px;height:22px;background:#2d5a8e"></div>
      <div style="flex:1"></div>
      <div class="sk-bar" style="width:60px;height:24px;background:#2d5a8e;border-radius:6px"></div>
      <div class="sk-bar" style="width:60px;height:24px;background:#2d5a8e;border-radius:6px"></div>
    </div>
    <div class="sk-tabs">
      <div class="sk-bar sk-tab" style="width:70px"></div>
      <div class="sk-bar sk-tab active" style="width:70px"></div>
      <div class="sk-bar sk-tab" style="width:60px"></div>
      <div class="sk-bar sk-tab" style="width:65px"></div>
      <div class="sk-bar sk-tab" style="width:75px"></div>
    </div>
    <div class="sk-content">
      <div class="sk-bar sk-row" style="width:100%;height:40px;border-radius:6px"></div>
      <div class="sk-bar sk-row"></div>
      <div class="sk-bar sk-row narrow"></div>
      <div class="sk-bar sk-row"></div>
      <div class="sk-bar sk-row" style="width:80%"></div>
      <div class="sk-bar sk-row narrow"></div>
      <div class="sk-bar sk-row"></div>
      <div class="sk-bar sk-row" style="width:75%"></div>
    </div>
    <div style="position:absolute;bottom:24px;width:100%;text-align:center;color:#94a3b8;font-size:12px">Loading Global Cost Sheet…</div>
  </div>
  <div id="root" style="margin:0;padding:0;width:100vw;height:100vh;overflow:auto;"></div>
  
  <script>@@ENGINE@@</script>

<script data-compiled="true">@@UI@@</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.warn('[GCS] SW registration failed:', err));
  });
}

// Share target handler — when a .pcw file is shared to the app via OS share menu
// The service worker intercepts the POST and stores the file for the app to consume
window.__pcwSharedFile = null;
if ('serviceWorker' in navigator) {
 navigator.serviceWorker.addEventListener('message', async (event) => {
  if (event.data?.type === 'SHARE_TARGET' && event.data.file) {
   const file = event.data.file;
   const text = await file.text();
   window.__pcwSharedFile = { text, name: file.name };
   // If React is already mounted, trigger load immediately
   if (window.__pcwLaunchCallback) {
    window.__pcwLaunchCallback(window.__pcwSharedFile);
    window.__pcwSharedFile = null;
   }
  }
 });
}

// File Handling API — capture launched .pcw file before React mounts
// Uses a dual approach: stores file globally AND calls React callback if already mounted
window.__pcwLaunchFile = null;
window.__pcwLaunchCallback = null; // React registers this once mounted

// Protocol handler — gcs://open?ref=Q-2025-001 opens the app with that context
// The URL is passed via window.location when launched via protocol
window.__pcwProtocolData = null;
(function() {
 const url = new URL(window.location.href);
 // When launched via protocol handler, Chrome passes the gcs:// URL as a query param
 const pcwUrl = url.searchParams.get('pcw_url') || url.searchParams.get('url');
 if (pcwUrl && pcwUrl.startsWith('gcs://')) {
  try {
   const pcwParsed = new URL(pcwUrl);
   const params = Object.fromEntries(pcwParsed.searchParams.entries());
   window.__pcwProtocolData = { action: pcwParsed.hostname || pcwParsed.pathname.slice(1), params };
   console.log('[GCS] Protocol launch:', window.__pcwProtocolData);
  } catch(e) {}
 }
})();

if (!('launchQueue' in window)) {
  console.log('[GCS] launchQueue API not available in this browser');
} else {
  console.log('[GCS] launchQueue API available — setting consumer');
  window.launchQueue.setConsumer(async (launchParams) => {
    console.log('[GCS] launchQueue consumer fired, files:', launchParams.files?.length ?? 0);
    if (!launchParams.files || launchParams.files.length === 0) {
      console.log('[GCS] No files in launchParams');
      return;
    }
    try {
      const fileHandle = launchParams.files[0];
      console.log('[GCS] Reading file handle:', fileHandle.name);
      const file = await fileHandle.getFile();
      const text = await file.text();
      console.log('[GCS] File read successfully, length:', text.length);
      window.__pcwLaunchFile = { text, name: file.name };
      // If React is already mounted and waiting, call it immediately
      if (window.__pcwLaunchCallback) {
        console.log('[GCS] React already mounted — calling callback directly');
        window.__pcwLaunchCallback(window.__pcwLaunchFile);
        window.__pcwLaunchFile = null;
      }
    } catch (e) {
      console.warn('[GCS] Launch file read failed:', e);
    }
  });
}
</script>
</body>
